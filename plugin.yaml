name: revamp
label: REVamp
kind: standalone
version: "1.0.0"
author: Argo
description: >
  Winamp-style music, audiobook and radio player for Hermes, with MilkDrop,
  skins, playlists, lyrics and four DJ tools.
  REVamp runs a loopback server with a token-protected API while Hermes is loaded. On macOS and Windows,
  another local account can load the player page and read the API token.
  Linux uses /proc/net/tcp to refuse other local users. If unreadable,
  REVamp logs a warning and accepts connections without checking the account.
  It reads Hermes settings, scans ~/Music by default and makes a read-only check
  of Music Studio's library.json and .wav folder. It keeps private 10-minute backups,
  a credential-masked activity ticker and a private rotating log (logs/revamp.log).
  Port leases and locks default to ~/.local/state/revamp/run
  (%LOCALAPPDATA%\revamp\run on Windows). It runs git to identify checkout
  builds. At startup it may use ps to identify its own leftover pop-out, then stop it.
  On Linux the optional Chrome-family pop-out writes two desktop entries under
  ~/.local/share/applications and icons in the data folder. The pop-out never
  opens a DevTools port; Linux and macOS drive it over a private pipe.
  Radio contacts Radio Browser, station streams and logo hosts. Lyrics use LRCLIB
  and skins use the Webamp Skin Museum. Without optional mutagen, tags fall back
  to low-priority ffprobe and built-in readers. Cover art falls back to built-in readers and folder images.
  No accounts, telemetry or stored passwords. See README.md for details.
# Verified and tested on Hermes 0.22.5. REVamp's
# manifest is also exercised by the repository's manifest-integrity tests.
requires_hermes: ">=0.22.5"
license: MIT
provides_tools:
  - revamp_player
  - revamp_library
  - revamp_playlist
  - revamp_radio
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
dashboard: dashboard
