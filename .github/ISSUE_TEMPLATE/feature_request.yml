name: Feature request
description: Something REVamp could do that it does not do today.
title: "[idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The listening, library or agent task, in your own words. A problem beats a solution here.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Screenshots or another player that does it well are welcome.
    validations:
      required: false
  - type: checkboxes
    id: limits
    attributes:
      label: Before submitting
      options:
        - label: I checked LIMITS.md; this is not something REVamp states it does not do on purpose.
          required: true
        - label: I searched the existing issues.
          required: true
