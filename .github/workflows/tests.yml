name: tests

# Linux and Windows run on every push. macOS minutes count 10x against the free
# allowance on a private repo, so macOS runs only when started by hand
# (Actions tab -> tests -> Run workflow) or once a week.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pytest:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install pytest
      - name: Run tests
        env:
          REVAMP_HOME: ${{ runner.temp }}/revamp-home
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python -m pytest -q
