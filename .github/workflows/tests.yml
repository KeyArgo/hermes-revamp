name: tests

# The release is supported on all three desktop platforms, so every push to
# main exercises all three. Browser coverage is deliberately a separate Linux
# job: it needs Chrome and websocket-client, neither of which should make the
# fast unit-test matrix flaky.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }}${{ matrix.python != '3.11' && format(' py{0}', matrix.python) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        # Windows os.set_blocking only exists from 3.12: media serving broke there unseen.
        include:
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    # macOS runners take ~29 min for the Python files alone (Linux ~6): 30 left the Node step no room.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install pytest websocket-client
      - name: Run non-browser tests
        env:
          REVAMP_HOME: ${{ runner.temp }}/revamp-home
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        # One process per test file, like tools/release_gate.sh: watcher threads and servers a
        # file starts must not disturb a later file (the whole tree in one process was flaky).
        run: >
          python tools/run_tests_per_file.py --durations 5
          --ignore tests/test_control_mode_play_e2e.py
          --ignore tests/test_nav_rail_e2e.py
          --ignore tests/test_hermes_radio.py
      - name: Run Node regression tests
        if: runner.os != 'Windows'
        run: for t in tests/*.test.mjs; do node --test "$t"; done

  e2e:
    name: browser e2e (ubuntu)
    runs-on: ubuntu-latest
    # The apt mirror alone has taken 28 minutes: give the tests themselves room.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chrome and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable ffmpeg
          python -m pip install pytest websocket-client
      - name: Run browser regressions
        env:
          CHROME_BIN: google-chrome
          REVAMP_HOME: ${{ runner.temp }}/revamp-home
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python -m pytest -q -p no:cacheprovider tests/test_*e2e.py tests/test_hermes_radio.py
