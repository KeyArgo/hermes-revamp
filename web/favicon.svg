<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="REVamp">
  <title>REVamp</title>
  <defs>
    <linearGradient id="fv-rew" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff2c6"/><stop offset="1" stop-color="#d8ff5c"/>
    </linearGradient>
    <linearGradient id="fv-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#5ff2c6"/>
    </linearGradient>
    <linearGradient id="fv-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff5c"/>
      <stop offset="0.5" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#5ff2c6"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="4" fill="url(#fv-ring)"/>
  <rect x="1" y="1" width="14" height="14" rx="3" fill="#0a0a12"/>
  <polygon points="6,1 2,4 6,7" fill="url(#fv-rew)"/>
    <polygon points="6,8 2,11 6,14" fill="url(#fv-rew)"/>
    <polygon points="7,1 14,4 7,7" fill="url(#fv-play)"/>
    <polygon points="7,8 10,8 14,14 11,14" fill="#d8ff5c"/>
</svg>
