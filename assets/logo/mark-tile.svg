<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="REVamp">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2030"/><stop offset="1" stop-color="#080b16"/></linearGradient>
    <linearGradient id="rew" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ff2c6"/><stop offset="1" stop-color="#d8ff5c"/></linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fd8"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#5ff2c6"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset=".5" stop-color="#232d3c"/><stop offset="1" stop-color="#151b26"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ff2c6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
    <pattern id="scan" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="4" fill="#5ff2c6" fill-opacity=".07"/></pattern>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5ff2c6" stop-opacity=".3"/><stop offset="1" stop-color="#5ff2c6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#b)"/>
  <circle cx="512" cy="512" r="420" fill="url(#g)"/>
  <!-- a classic player window -->
  <rect x="150" y="214" width="724" height="596" rx="40" fill="url(#chrome)" stroke="#5ff2c6" stroke-opacity=".5" stroke-width="6"/>
  <rect x="150" y="214" width="724" height="58" rx="28" fill="url(#title)" opacity=".85"/>
  <g fill="#0b1018" fill-opacity=".7"><rect x="760" y="232" width="22" height="22" rx="4"/><rect x="796" y="232" width="22" height="22" rx="4"/><rect x="832" y="232" width="22" height="22" rx="4"/></g>
  <!-- LCD -->
  <rect x="190" y="304" width="644" height="412" rx="22" fill="#060a0f"/>
  <rect x="190" y="304" width="644" height="412" rx="22" fill="url(#scan)"/>
  <g transform="translate(222 344) scale(2.9)">
    <polygon points="32,0 0,24 32,48" fill="url(#rew)"/>
    <polygon points="32,52 0,76 32,100" fill="url(#rew)"/>
    <path d="M36 0 100 24 36 48Z M44.3 12 76.3 24 44.3 36Z" fill="url(#play)" fill-rule="evenodd"/>
    <polygon points="36,52 64,52 100,100 72,100" fill="#d8ff5c"/>
  </g>
  <!-- spectrum analyser with peak caps -->
  <g>
    <rect x="560" y="560" width="30" height="120" rx="4" fill="#5ff2c6"/><rect x="600" y="500" width="30" height="180" rx="4" fill="#8af3ab"/>
    <rect x="640" y="440" width="30" height="240" rx="4" fill="#b6f78a"/><rect x="680" y="520" width="30" height="160" rx="4" fill="#d8ff5c"/>
    <rect x="720" y="470" width="30" height="210" rx="4" fill="#ff8ae6"/><rect x="760" y="580" width="30" height="100" rx="4" fill="#ff4fd8"/>
    <g fill="#ffffff"><rect x="600" y="480" width="30" height="8" rx="2"/><rect x="640" y="420" width="30" height="8" rx="2"/><rect x="720" y="450" width="30" height="8" rx="2"/></g>
  </g>
  <!-- seek bar -->
  <rect x="190" y="748" width="644" height="20" rx="10" fill="#0b1018"/>
  <rect x="190" y="748" width="400" height="20" rx="10" fill="url(#rew)"/>
  <circle cx="590" cy="758" r="22" fill="#ffffff"/>
  <rect x="68" y="68" width="888" height="888" rx="204" fill="none" stroke="url(#rew)" stroke-width="8" opacity=".35"/>
  <path d="M842 176c-40 6-78 26-104 58 30-6 58-4 82 6-24 4-46 14-62 30 28-2 52 4 70 16-14-34-8-80 14-110Z" fill="#f2f4ff" opacity=".9"/>
</svg>
